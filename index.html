<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VK Enterprises – Tools & Machinery</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Track tools & machinery stock availability on site.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff;--card:#fff;--soft:#f6f7f9;--ink:#111418;--mute:#737a86;--line:#e9ebef;--pri:#111418;--priD:#111418;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--blue:#2563eb;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(8px);color:var(--ink);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1}
header button{background:var(--soft);border:0;border-radius:99px;color:inherit;padding:8px 14px;font-size:14px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--soft);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mute);font-size:13px}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--soft);border-color:transparent !important;border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--soft);color:inherit;border-radius:99px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item h3{margin:0;font-size:17px}.meta{color:var(--mute);font-size:13px;margin-top:2px}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.ok{background:#16a34a14;color:var(--ok)}.low{background:#d9770618;color:var(--warn)}.out{background:#dc262614;color:var(--bad)}
.meter{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--ok)}.meter.low i{background:var(--warn)}.meter.out i{background:var(--bad)}
.nums{display:flex;justify-content:space-between;font-size:14px}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font:600 15px inherit;background:var(--soft);color:var(--ink)}
.btn.p{background:var(--pri);color:#fff}.btn.o{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}.btn.d{color:var(--bad)}.btn:disabled{opacity:.4}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;filter:grayscale(1);opacity:.7}nav button.on span{opacity:1}nav button.on{color:var(--priD);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;font-weight:300;box-shadow:0 4px 16px #0003;z-index:7}
.sheet-bg{position:fixed;inset:0;background:#0006;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.log small{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.sec{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
</style>
</head>
<body>
<header><h1>VK Enterprises</h1></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Add item">+</button>
<nav>
  <button data-tab="stock" class="on"><span>📦</span>Stock</button>
  <button data-tab="out"><span>🚚</span>On Site</button>
  <button data-tab="log"><span>📜</span>History</button>
  <button data-tab="more"><span>⚙️</span>More</button>
</nav>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script>
const KEY='sitestock.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>ESC[c]);
function seed(){
  const mk=(name,cat,total,unit,min,loc)=>({id:uid(),name,total,unit,notes:'',issued:[]});
  return {sites:[],site:'All',
   items:[mk('Cordless Drill','Power Tools',12,'pcs',3,''),mk('Angle Grinder','Power Tools',8,'pcs',2,''),
   mk('Excavator JCB 3DX','Machinery',2,'units',1,''),mk('Concrete Mixer','Machinery',4,'units',1,''),
   mk('Plate Compactor','Machinery',3,'units',1,''),mk('Scaffold Frame','Scaffolding',120,'pcs',30,''),
   mk('Safety Helmet','Safety',60,'pcs',20,''),mk('Extension Reel 50m','Electrical',10,'pcs',3,''),
   mk('Spirit Level 1.2m','Hand Tools',15,'pcs',4,'')],log:[]};
}
const CLOUD=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey);
const SITES0=[];
let S,user=null,authReady=!CLOUD,FB=null,subs=[];
if(CLOUD){let s='All';try{s=localStorage.getItem(KEY+'.site')||'All'}catch(e){}S={sites:SITES0,site:s,items:[],log:[]}}
else{try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.items){S=seed();save()}S.log=(S.log||[]).map(l=>l.id?l:{...l,id:uid()})}
function save(){try{CLOUD?localStorage.setItem(KEY+'.site',S.site):localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const byId=id=>S.items.find(i=>i.id===id);

/* ---------- data layer: localApi (this device) or cloudApi (shared Firebase) ---------- */
const FIELDS={name:'Name',total:'Quantity',unit:'Unit'};
function diff(o,d){if(!o)return'';const c=Object.keys(FIELDS).filter(k=>String(o[k]??'')!==String(d[k]??'')).map(k=>`${FIELDS[k]} ${o[k]} → ${d[k]}`);if((o.notes||'')!==(d.notes||''))c.push('Item notes updated');return c.join('; ')}
const clean=e=>Object.fromEntries(Object.entries(e).filter(([,v])=>v!==undefined&&v!==''&&v!==null));
// One entry per site per tool: quantities are clubbed, names combined.
function mergeIssued(l){const m={};l.forEach(x=>{const k=x.site;if(!m[k])m[k]={id:x.id,site:k,qty:0,date:x.date,w:[]};const e=m[k];e.qty+=x.qty;e.date=Math.min(e.date,x.date);(x.who||'').split(',').map(a=>a.trim()).filter(Boolean).forEach(w=>{if(!e.w.includes(w))e.w.push(w)})});return Object.values(m).filter(x=>x.qty>0).map(({w,...x})=>({...x,who:w.join(', ')}))}
const club=i=>mergeIssued(i.issued||[]);
function applyReturn(list,site,qty,to){const l=mergeIssued(list),x=l.find(y=>y.site===site);if(!x||qty>x.qty)throw Error('Invalid quantity');const from=x.site,who=x.who;x.qty-=qty;
  const out=to?[...l.filter(y=>y.qty>0),{id:uid(),site:to,who,qty,date:Date.now()}]:l.filter(y=>y.qty>0);return{issued:mergeIssued(out),from,who}}
const logL=e=>S.log.unshift({id:uid(),...e});
const localApi={
 async deleteLog(id){S.log=S.log.filter(l=>l.id!==id);save()},
 async saveItem(id,d,isNew,note){const old=isNew?null:{...byId(id)};if(isNew)S.items.unshift({id,issued:[],...d});else Object.assign(byId(id),d);
  const detail=isNew?'':diff(old,d);if(isNew||detail||note)logL(clean({type:isNew?'add':'edit',name:d.name,qty:isNew?d.total:undefined,detail,note,date:Date.now()}));save()},
 async deleteItem(id){const i=byId(id);S.items=S.items.filter(x=>x.id!==id);logL({type:'delete',name:i.name,date:Date.now()});save()},
 async issue(id,{site,who,qty,note}){const i=byId(id);if(qty>avail(i))throw Error('Only '+avail(i)+' available');const date=Date.now();i.issued=mergeIssued([...i.issued,{id:uid(),site,who,qty,date}]);logL(clean({type:'issue',name:i.name,qty,site,who,note,date}));save()},
 async ret(id,site,qty,note){const i=byId(id),r=applyReturn(i.issued,site,qty);i.issued=r.issued;logL(clean({type:'return',name:i.name,qty,site,who:r.who,note,date:Date.now()}));save()},
 async transfer(id,site,qty,to,note){const i=byId(id),r=applyReturn(i.issued,site,qty,to);i.issued=r.issued;logL(clean({type:'transfer',name:i.name,qty,site,to,who:r.who,note,date:Date.now()}));save()},
 async setSites(l){S.sites=l;save()}
};
const cloudApi={
 async deleteLog(id){const {F,fs}=FB;F.deleteDoc(F.doc(fs,'log',id)).catch(e=>toast(e.message))},
 clog(e){const {F,fs}=FB;F.addDoc(F.collection(fs,'log'),clean({...e,date:Date.now(),by:user.email})).catch(()=>{})},
 async saveItem(id,d,isNew,note){const {F,fs}=FB;const r=F.doc(fs,'items',id),old=isNew?null:{...byId(id)};
  (isNew?F.setDoc(r,{...d,issued:[]}):F.updateDoc(r,d)).catch(e=>toast(e.message));
  const detail=isNew?'':diff(old,d);if(isNew||detail||note)this.clog({type:isNew?'add':'edit',name:d.name,qty:isNew?d.total:undefined,detail,note})},
 async deleteItem(id){const {F,fs}=FB;const name=byId(id).name;F.deleteDoc(F.doc(fs,'items',id)).catch(e=>toast(e.message));this.clog({type:'delete',name})},
 async issue(id,{site,who,qty,note}){const {F,fs}=FB;const r=F.doc(fs,'items',id);let name;
  await F.runTransaction(fs,async t=>{const s=await t.get(r),it=s.data(),list=it.issued||[],a=it.total-list.reduce((x,y)=>x+y.qty,0);if(qty>a)throw Error('Only '+a+' available now');name=it.name;t.update(r,{issued:mergeIssued([...list,{id:uid(),site,who,qty,date:Date.now()}])})});
  this.clog({type:'issue',name,qty,site,who,note})},
 async ret(id,site,qty,note){const {F,fs}=FB;const r=F.doc(fs,'items',id);let name,who;
  await F.runTransaction(fs,async t=>{const s=await t.get(r),it=s.data(),x=applyReturn(it.issued||[],site,qty);name=it.name;who=x.who;t.update(r,{issued:x.issued})});
  this.clog({type:'return',name,qty,site,who,note})},
 async transfer(id,site,qty,to,note){const {F,fs}=FB;const r=F.doc(fs,'items',id);let name,who;
  await F.runTransaction(fs,async t=>{const s=await t.get(r),it=s.data(),x=applyReturn(it.issued||[],site,qty,to);name=it.name;who=x.who;t.update(r,{issued:x.issued})});
  this.clog({type:'transfer',name,qty,site,to,who,note})},
 async setSites(list){const {F,fs}=FB;F.setDoc(F.doc(fs,'meta','sites'),{list}).catch(e=>toast(e.message))}
};
const api=CLOUD?cloudApi:localApi;
async function run(p,msg){try{await p;render();if(msg)toast(msg)}catch(e){toast(e.message||'Something went wrong')}}

async function cloudInit(){
  try{
    const b='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,F,Au]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-firestore.js'),import(b+'firebase-auth.js')]);
    const app=A.initializeApp(window.FIREBASE_CONFIG);
    const fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
    const auth=Au.getAuth(app);FB={A,F,Au,fs,auth};
    Au.onAuthStateChanged(auth,u=>{subs.forEach(f=>f());subs=[];user=u;authReady=true;if(u)listen();render()});
  }catch(e){authReady=true;$('#app').innerHTML='<div class="empty">Could not connect to the cloud database.<br>Check your internet connection and refresh.</div>'}
}
function listen(){
  const {F,fs}=FB,soft=()=>{if(document.activeElement&&document.activeElement.id==='q')return;render()},err=e=>toast(e.code==='permission-denied'?'No permission – check Firestore rules':e.message);
  subs.push(F.onSnapshot(F.collection(fs,'items'),s=>{S.items=s.docs.map(d=>({...d.data(),id:d.id,issued:d.data().issued||[]})).sort((a,b)=>a.name.localeCompare(b.name));soft()},err));
  subs.push(F.onSnapshot(F.doc(fs,'meta','sites'),s=>{S.sites=s.exists()?(s.data().list||[]):SITES0;soft()},err));
  subs.push(F.onSnapshot(F.query(F.collection(fs,'log'),F.orderBy('date','desc'),F.limit(200)),s=>{S.log=s.docs.map(d=>({...d.data(),id:d.id}));soft()},err));
}
const out=i=>i.issued.reduce((a,x)=>a+x.qty,0);
const avail=i=>i.total-out(i);
const state=i=>avail(i)<=0?'out':'ok';
const label={ok:'Available',out:'Out of stock'};
let tab='stock',q='',openSite=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function open(html){$('#sheet').innerHTML=html;$('#bg').classList.add('show')}
function close(){$('#bg').classList.remove('show')}
$('#bg').addEventListener('click',e=>{if(e.target.id==='bg')close()});

function visible(){return S.items.filter(i=>!q||i.name.toLowerCase().includes(q.toLowerCase()))}

function card(i){
  const st=state(i),a=avail(i),pct=i.total?Math.max(0,a/i.total*100):0;
  return `<div class="item"><div class="row"><div><h3>${esc(i.name)}</h3>${i.notes?`<div class="meta">${esc(i.notes)}</div>`:''}</div><span class="badge ${st}">${label[st]}</span></div>
  <div class="meter ${st}"><i style="width:${pct}%"></i></div>
  <div class="nums"><span><b>${a}</b> available</span><span>${out(i)} on site</span><span>${i.total} total ${esc(i.unit)}</span></div>
  <div class="acts"><button class="btn o" data-issue="${i.id}" ${a<=0||!S.sites.length?'disabled':''}>Issue</button><button class="btn" data-ret="${i.id}" ${out(i)<=0?'disabled':''}>Return</button><button class="btn" data-edit="${i.id}">Edit</button></div></div>`}

function render(){
  $('#fab').style.display=(tab==='stock'&&(!CLOUD||user))?'block':'none';
  const A=$('#app');
  if(CLOUD&&!user){
    A.innerHTML=authReady?`<div class="item" style="margin-top:20px"><h3>Sign in</h3><p class="meta">Use the email and password your site admin gave you.</p>
    <label>Email</label><input id="em" type="email" autocomplete="username" inputmode="email">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="acts"><button class="btn p" id="login">Sign in</button></div></div>`:'<div class="empty">Loading…</div>';
    return}
  if(tab==='stock'){
    const it=S.items,tot=it.length,o=it.filter(i=>state(i)==='out').length,onsite=it.reduce((a,i)=>a+out(i),0);
    const list=visible();
    A.innerHTML=`<div class="stats"><div class="stat"><b>${tot}</b><span>Item types</span></div><div class="stat"><b>${onsite}</b><span>Units on site</span></div><div class="stat"><b style="color:var(--bad)">${o}</b><span>Out of stock</span></div></div>
    <div class="bar"><input id="q" type="search" placeholder="Search tools & machinery…" value="${esc(q)}"></div>
    ${S.sites.length?'':'<div class="item meta" style="background:var(--soft);border:0">Add a site in <button class="chip" data-gomore="1" style="padding:4px 10px">More</button> to start issuing tools.</div>'}
    ${list.length?list.map(card).join(''):'<div class="empty">No items found.<br>Tap + to add one.</div>'}`;
    const qi=$('#q');qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  }else if(tab==='out'){
    const by={};S.sites.forEach(n=>by[n]=[]);S.items.forEach(i=>club(i).forEach(x=>{(by[x.site]=by[x.site]||[]).push({i,x})}));
    if(openSite!==null&&!by[openSite])openSite=null;
    if(openSite!==null){
      const rows=by[openSite],units=rows.reduce((a,r)=>a+r.x.qty,0);
      A.innerHTML=`<button class="chip" data-back="1" style="margin-bottom:12px">‹ All sites</button><h2 style="margin:0 0 2px">${esc(openSite)}</h2><div class="meta" style="margin-bottom:14px">${rows.length} tool${rows.length==1?'':'s'} · ${units} unit${units==1?'':'s'} issued</div>`+(rows.length?rows.map(({i,x})=>`<div class="item"><div class="row"><div><h3>${esc(i.name)}</h3><div class="meta">Since ${new Date(x.date).toLocaleDateString()}</div></div><span class="badge low">${x.qty} ${esc(i.unit)}</span></div><div class="acts"><button class="btn" data-retone="${i.id}" data-rsite="${esc(x.site)}">Return</button></div></div>`).join(''):'<div class="empty">No tools issued to this site.</div>');
    }else{
      const names=Object.keys(by);
      A.innerHTML=`<div class="sec">Sites</div>`+(names.length?names.map(n=>{const r=by[n],u=r.reduce((a,z)=>a+z.x.qty,0);return `<button class="item" data-site="${esc(n)}" style="width:100%;text-align:left;color:inherit;font:inherit;display:block"><div class="row" style="align-items:center"><div><h3>${esc(n)}</h3><div class="meta">${r.length?`${r.length} tool${r.length==1?'':'s'} · ${u} unit${u==1?'':'s'} issued`:'Nothing issued'}</div></div><span style="font-size:22px;color:var(--mute)">›</span></div></button>`}).join(''):'<div class="empty">No sites yet.<br>Add a site in More to start issuing.</div>');
    }
  }else if(tab==='log'){
    const T={issue:'➡️ Issued',return:'⬅️ Returned',transfer:'🔁 Transferred',add:'➕ Added item',edit:'✏️ Edited item',delete:'🗑️ Deleted item'};
    A.innerHTML=`<div class="sec">Activity</div>`+(S.log.length?S.log.slice(0,200).map(l=>`<div class="log"><div class="row"><div><b>${T[l.type]||esc(l.type)}</b> ${l.qty!=null?esc(l.qty)+' × ':''}${esc(l.name)}<br><small>${[l.to?esc(l.site)+' → '+esc(l.to):esc(l.site||''),l.who?esc(l.who):'',l.by?'by '+esc(l.by):'',new Date(l.date).toLocaleString()].filter(Boolean).join(' · ')}</small>${l.detail?`<br><small>${esc(l.detail)}</small>`:''}${l.note?`<div style="margin-top:6px">📝 ${esc(l.note)}</div>`:''}</div><button class="btn d" style="flex:none;padding:6px 10px;background:none" data-dellog="${esc(l.id)}" aria-label="Delete entry">✕</button></div></div>`).join(''):'<div class="empty">No activity yet.</div>');
  }else{
    A.innerHTML=`<div class="sec">Sites</div><div class="item">${S.sites.map(s=>`<div class="row" style="padding:6px 0"><span>📍 ${esc(s)}</span><button class="btn d" style="flex:none;padding:6px 12px" data-delsite="${esc(s)}">✕</button></div>`).join('')}
    <div class="bar" style="margin:10px 0 0"><input id="ns" placeholder="New site name"><button class="btn p" style="flex:none" id="addSite">Add</button></div></div>
    ${CLOUD?`<div class="sec">Account</div><div class="item"><div class="row" style="align-items:center"><span class="meta" style="margin:0">☁️ Shared live data<br>${esc(user.email)}</span><button class="btn" style="flex:none" id="logout">Sign out</button></div></div>`:''}
    <div class="sec">Data</div><div class="item"><div class="acts" style="margin:0"><button class="btn" id="exCsv">Export CSV</button><button class="btn" id="exJson">Backup JSON</button></div>
    ${CLOUD?'<p class="meta">Stock is shared live with everyone signed in.</p>':'<div class="acts"><button class="btn" id="imp">Restore backup</button><button class="btn d" id="reset">Reset</button></div><input type="file" id="file" accept=".json" hidden><p class="meta">Data is stored on this device only. Use Backup to move it elsewhere.</p>'}</div>
    <div class="sec">Install</div><div class="item meta">Open your browser menu → “Add to Home Screen” to use SiteStock like an app, even offline.</div>`;
  }
}

function itemForm(i){
  const n=!i;i=i||{name:'',total:1,unit:'pcs',notes:''};
  open(`<h2>${n?'Add item':'Edit item'}</h2>
  <label>Name</label><input id="f_name" value="${esc(i.name)}" placeholder="e.g. Hilti Drill">
  <div class="g2"><div><label>Quantity in stock</label><input id="f_total" type="number" inputmode="numeric" min="0" value="${i.total}"></div>
  <div><label>Unit</label><input id="f_unit" value="${esc(i.unit)}"></div></div>
  <label>Item notes</label><textarea id="f_notes" rows="2">${esc(i.notes)}</textarea>
  <label>History note (optional)</label><input id="f_nt" placeholder="${n?'e.g. purchased from ABC Traders':'Reason for this change'}">
  <div class="acts"><button class="btn" id="cancel">Cancel</button>${n?'':'<button class="btn d" id="del">Delete</button>'}<button class="btn p" id="ok">Save</button></div>`);
  $('#cancel').onclick=close;
  if(!n)$('#del').onclick=()=>{if(confirm('Delete '+i.name+'?')){close();run(api.deleteItem(i.id),'Deleted')}};
  $('#ok').onclick=()=>{
    const name=$('#f_name').value.trim();if(!name)return toast('Enter a name');
    const total=Math.max(0,+$('#f_total').value||0);
    if(!n&&total<out(i))return toast(`${out(i)} units are on site`);
    const d={name,total,unit:$('#f_unit').value.trim()||'pcs',notes:$('#f_notes').value};
    close();run(api.saveItem(n?uid():i.id,d,n,$('#f_nt').value.trim()),'Saved')};
}

function issueForm(i){
  if(!S.sites.length)return toast("Add a site first");
  open(`<h2>Issue: ${esc(i.name)}</h2><p class="meta">${avail(i)} ${esc(i.unit)} available</p>
  <label>Send to site</label><select id="s">${S.sites.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
  <label>Quantity</label><input id="n" type="number" inputmode="numeric" min="1" max="${avail(i)}" value="1">
  <label>Note (optional)</label><input id="nt" placeholder="e.g. needed for slab work">
  <div class="acts"><button class="btn" id="cancel">Cancel</button><button class="btn p" id="ok">Issue</button></div>`);
  $('#cancel').onclick=close;
  $('#ok').onclick=()=>{const qty=+$('#n').value;if(!(qty>=1&&qty<=avail(i)))return toast('Invalid quantity');
    const site=$('#s').value;
    close();run(api.issue(i.id,{site,qty,note:$('#nt').value.trim()}),'Issued')};
}
function returnForm(i,only){
  const list=only?[only]:club(i);
  open(`<h2>Return / transfer: ${esc(i.name)}</h2>
  <label>From</label><select id="r">${list.map(x=>`<option value="${esc(x.site)}">${esc(x.site)} – ${x.qty} ${esc(i.unit)}</option>`).join('')}</select>
  <label>To</label><select id="t"></select>
  <label>Quantity</label><input id="n" type="number" inputmode="numeric" min="1" value="1">
  <label>Note (optional)</label><input id="nt" placeholder="e.g. damaged handle, returned early">
  <div class="acts"><button class="btn" id="cancel">Cancel</button><button class="btn p" id="ok">Return</button></div>`);
  const cur=()=>list.find(y=>y.site===$('#r').value);
  const upd=()=>{const x=cur(),prev=$('#t').value;$('#t').innerHTML='<option value="">Back to stock</option>'+S.sites.filter(n=>n!==x.site).map(n=>`<option ${n===prev?'selected':''}>${esc(n)}</option>`).join('');lbl()};
  const lbl=()=>{$('#ok').textContent=$('#t').value?'Transfer':'Return'};
  $('#r').onchange=upd;$('#t').onchange=lbl;upd();
  $('#cancel').onclick=close;
  $('#ok').onclick=()=>{const x=cur(),qty=+$('#n').value,to=$('#t').value;if(!x||!(qty>=1&&qty<=x.qty))return toast('Invalid quantity');const note=$('#nt').value.trim();close();
    run(to?api.transfer(i.id,x.site,qty,to,note):api.ret(i.id,x.site,qty,note),to?'Transferred':'Returned')};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset,find=id=>S.items.find(i=>i.id===id);
  if(d.tab){tab=d.tab;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));render();scrollTo(0,0)}
  else if(d.issue)issueForm(find(d.issue));
  else if(d.ret)returnForm(find(d.ret));
  else if(d.edit)itemForm(find(d.edit));
  else if(d.retone){const i=find(d.retone);returnForm(i,club(i).find(x=>x.site===d.rsite))}
  else if(d.dellog){const l=S.log.find(x=>x.id===d.dellog);if(!l)return;
    open(`<h2>Delete history entry?</h2><p class="meta">${esc(l.type)} · ${l.qty!=null?esc(l.qty)+' × ':''}${esc(l.name)} · ${new Date(l.date).toLocaleString()}${l.note?'<br>📝 '+esc(l.note):''}</p><p class="meta">This only removes the record from History. Stock and site quantities are not changed. It can't be undone.</p>
    <div class="acts"><button class="btn" id="cancel">Cancel</button><button class="btn p" style="background:var(--bad)" data-dellogok="${esc(l.id)}">Delete</button></div>`);
    $('#cancel').onclick=close}
  else if(d.dellogok){close();run(api.deleteLog(d.dellogok),'Entry deleted')}
  else if(d.delsite){if(S.items.some(i=>i.issued.some(x=>x.site===d.delsite)))return toast('Return tools issued to this site first');run(api.setSites(S.sites.filter(s=>s!==d.delsite)))}
  else if(d.site!==undefined){openSite=d.site;render();scrollTo(0,0)}
  else if(d.back!==undefined){openSite=null;render();scrollTo(0,0)}
  else if(d.gomore!==undefined){document.querySelector('[data-tab=more]').click()}
  else if(t.id==='fab')itemForm();


  else if(t.id==='addSite'){const v=$('#ns').value.trim();if(!v||S.sites.includes(v))return toast('Enter a unique name');run(api.setSites([...S.sites,v]))}
  else if(t.id==='login'){const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw)return toast('Enter email and password');FB.Au.signInWithEmailAndPassword(FB.auth,em,pw).catch(()=>toast('Wrong email or password'))}
  else if(t.id==='logout'){FB.Au.signOut(FB.auth)}
  else if(t.id==='exCsv'){const r=[['Name','Total','On site','Available','Unit']];S.items.forEach(i=>r.push([i.name,i.total,out(i),avail(i),i.unit]));dl('sitestock.csv','text/csv',r.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'))}
  else if(t.id==='exJson')dl('sitestock-backup.json','application/json',JSON.stringify(S,null,1));
  else if(t.id==='imp')$('#file').click();
  else if(t.id==='reset'){if(confirm('Erase all data and reload sample data?')){S=seed();save();render()}}
});
document.addEventListener('change',e=>{if(e.target.id==='file'){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const j=JSON.parse(x);if(!j.items)throw 0;S=j;save();render();toast('Restored')}catch(_){toast('Invalid backup file')}})}});
function dl(n,m,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
render();
if(CLOUD)cloudInit();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
